spring.application.name=backend

# URL de conexão com o PostgreSQL (substitua 'nome_do_banco' pelo seu banco)
spring.datasource.url=jdbc:postgresql://localhost:5432/backend

# Credenciais de acesso
spring.datasource.username=postgres
spring.datasource.password=admin

# Driver do PostgreSQL (opcional nas versões mais recentes, mas recomendado)
spring.datasource.driver-class-name=org.postgresql.Driver

# it wont autocreate tables otherwise
# @SpringBootApplication(scanBasePackages = {"com.theozitos2007.backend" })

# Configurações do Hibernate / JPA
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect